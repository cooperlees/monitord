# monitord config
# Pure ini - no yes/no for bools

[monitord]
dbus_address = unix:path=/run/dbus/system_bus_socket
dbus_timeout = 5
daemon = false
daemon_stats_refresh_secs = 60
key_prefix = monitord
output_format = json-flat

# Disabled as access isn't on by default - see README.md
# enabled must be true for sub stats to be collected
[dbus]
enabled = false
stale_fd_stats = true
user_stats = false
peer_stats = false
# Only report peers that own a well-known bus name when peer_stats is on
peer_well_known_names_only = false
# Max well-known bus names whose owner lookup runs concurrently when peer_stats
# is on
peer_name_concurrency = 8
cgroup_stats = false

# Grab networkd stats from files + networkctl
# Or via varlink API (io.systemd.Network.Describe) if [varlink] enabled = true
# Varlink requires systemd 257+; falls back to file-based on failure
[networkd]
enabled = true
varlink = true
link_state_dir = /run/systemd/netif/links

[pid1]
enabled = true

[services]
# Remove 'd' so it works when I test on ubuntu
chrony.service
sshd.service

[system-state]
enabled = true
# Also gates version collection (shared Manager.Describe), even when this
# section is disabled
varlink = true

[timers]
enabled = true
# No varlink toggle here: timers ride the units path and follow [units] varlink

[timers.allowlist]
fstrim.timer

[units]
enabled = true
varlink = true
state_stats = true
state_stats_time_in_state = true
ignore_inactive_oneshot_services = true
unit_files = true
# Max units whose D-Bus work runs concurrently in the per-unit collection loop
per_unit_concurrency = 8
# Number of slowest units (by per-unit collection duration) to record;
# 0 disables
slowest_units_count = 5

[units.state_stats.allowlist]
# Remove 'd' so it works when I test on ubuntu
chrony.service
sshd.service

[machines]
enabled = true
varlink = true

# Varlink toggles, shown at their defaults to help move collectors over one at
# a time: [varlink] enabled is the global master switch, and each
# varlink-capable section ([units], [networkd], [system-state], [boot],
# [machines], [verify]) has its own `varlink` toggle (default true).
# A collector uses
# varlink only when both are true. [machines] varlink covers machine
# enumeration (io.systemd.Machine.List, v257+) and container collection.
# For container collection a non-root monitord also needs CAP_SYS_ADMIN
# besides CAP_SYS_PTRACE (see README Permissions); without it monitord warns
# once and uses D-Bus for containers. [system-state] varlink also gates version
# collection, which shares the Manager.Describe call. Timers have no toggle
# of their own and follow [units] varlink.
# no_fallback = true turns any varlink failure into a hard error instead of
# falling back to D-Bus (or files for networkd): enable it in CI to prove
# a collector set is varlink-clean rather than silently D-Bus-served.
[varlink]
enabled = false
no_fallback = false

[machines.allowlist]
fedora38

[machines.blocklist]
fedora39

# Boot blame metrics - disabled by default
# Shows the N slowest units at boot (similar to systemd-analyze blame)
[boot]
enabled = false
varlink = true
# Cache boot blame stats in <cache_dir>/<boot_id>.boot_blame.bin
# Enabled by default; set false to force recalculation every run
cache_enabled = true
# Directory where boot blame cache files are stored
# Defaults to /run/monitord if not set
cache_dir = /tmp
num_slowest_units = 5

# Optional: only include specific units in boot blame (if empty, all units are checked)
[boot.allowlist]
# slow-startup.service

# Optional: exclude specific units from boot blame
[boot.blocklist]
# noisy-but-expected.service

# systemd-report (systemd v260+), two independent switches:
# - enabled: serve monitord's own health (last run healthy, per-collector
#   timings and failure counters) on /run/systemd/report/io.monitord. Daemon
#   mode only. Pairs with monitord-report.socket; see "systemd-report
#   integration" in the README.
# - collect: pass through metrics from other systemd-report sources:
#   every io.systemd.Metrics socket in /run/systemd/report/ except
#   io.systemd.Manager and io.systemd.Network (already parsed by the units and
#   networkd collectors), io.monitord (monitord itself), io.systemd.CGroup
#   (too many keys until per-cgroup filtering lands) and systemd-report's
#   io.systemd.Report.* signers. A source may publish thousands of metrics.
#   Always varlink: there is no D-Bus fallback, and [varlink] enabled does
#   not gate it.
[report]
enabled = false
collect = false

# Optional: only collect these sources (if empty, all sources are collected)
[report.sources.allowlist]
# io.systemd.Basic

# Optional: never collect these sources (preferred over the allowlist)
[report.sources.blocklist]
# io.systemd.Files

# Never collect these metrics from any source. An entry also covers every
# metric under it (io.systemd.Basic.SMBIOS covers ...SMBIOS.SystemProductName).
# By default this drops identifiers that would otherwise be shipped with every
# sample: they identify a host or its hardware but say nothing about health
# (see "systemd-report sources" in the README). Delete lines you want back.
[report.metrics.blocklist]
io.systemd.Basic.BootID
io.systemd.Basic.Hostname
io.systemd.Basic.MachineID
io.systemd.Basic.SMBIOS
io.systemd.Basic.TPM2
io.systemd.Journal.HighPriorityMessage

# Unit verification using systemd-analyze verify
# Disabled by default as it can be slow on large systems
[verify]
enabled = false
varlink = true

# Optional: only verify specific units (if empty, all units are checked)
[verify.allowlist]
# example.service
# example.timer

# Optional: skip verification for specific units
[verify.blocklist]
# noisy.service
# broken.timer
