name: Varlink Integration Test

on: [push, pull_request]

jobs:
  varlink_fedora_rawhide:
    name: Varlink smoke test on Fedora Rawhide
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Unit test the integration test helpers
        run: python3 varlink_integration_unittests.py

      - name: Varlink vs D-Bus parity test
        run: python3 varlink_integration_test.py --repo "$GITHUB_WORKSPACE"
